name: proyecto_moviles2_grupo03

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  cupertino_icons: ^1.0.8

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  image: ^4.12.0
  fl_chart: ^1.3.0
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Tipografia de Pondera (DESIGN.md seccion 3). Se empaquetan localmente
  # para que funcionen sin internet y en flutter test.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

# Icono de la app (Pondera). Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icono.png"
  min_sdk_android: 21
  # Icono adaptativo (Android 8+): fondo indigo de marca y las barras al centro.
  adaptive_icon_background: "#3B36C4"
  adaptive_icon_foreground: "assets/icon/icono_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icono.png"
    background_color: "#3B36C4"
    theme_color: "#3B36C4"
